spring.application.name=inventory-service
server.address=127.0.0.1
server.port=8082

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/pizzaops_inventory}
spring.datasource.username=${DB_USERNAME:pizzaops}
spring.datasource.password=${DB_PASSWORD:pizzaops-local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jackson.deserialization.accept-float-as-int=false

management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [traceId=%X{traceId:-none}]
