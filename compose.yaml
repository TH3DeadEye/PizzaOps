services:
  inventory-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pizzaops_inventory
      POSTGRES_USER: pizzaops
      POSTGRES_PASSWORD: pizzaops-local
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - inventory-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizzaops -d pizzaops_inventory"]
      interval: 3s
      timeout: 3s
      retries: 10

  inventory-test-db:
    image: postgres:16
    profiles: ["test"]
    environment:
      POSTGRES_DB: pizzaops_inventory_test
      POSTGRES_USER: pizzaops
      POSTGRES_PASSWORD: pizzaops-local
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizzaops -d pizzaops_inventory_test"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  inventory-data:
